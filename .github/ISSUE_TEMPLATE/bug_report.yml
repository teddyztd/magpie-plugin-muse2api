name: Bug 报告
description: 某个能力不可用、返回异常或宿主报错
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 `docs/qa-report.md` 的「错误契约」一节：
        参数类型/必填错误由宿主在工具执行前拦截，返回的是宿主文案，不是插件的 JSON。
  - type: input
    id: version
    attributes:
      label: 插件版本 / 提交
      description: 插件页显示的版本号或提交短哈希
      placeholder: 0.1.0 / a10031d
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Magpie 版本与平台
      placeholder: magpie 0.1.x / Windows 11
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: muse2api 实例
      description: 地址与版本（不需要贴 API Key）
      placeholder: http://127.0.0.1:18610，app.py 1.6.11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 登录（网页 Cookie / API Key）
        - 文本（muse-spark）
        - 图片（generate_image / image_status）
        - 视频（generate_video / video_status）
        - 供应商页显示
        - 安装 / 更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 插件 → muse2api → 登录
        2. 调用 muse2api_generate_image，prompt=…
        3. 见报错
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际（原始返回 / 日志）
      description: 工具返回的 JSON、Magpie 插件页报错、或 `%LOCALAPPDATA%\Magpie\logs\app.log` 的相关行
      render: json
    validations:
      required: true
