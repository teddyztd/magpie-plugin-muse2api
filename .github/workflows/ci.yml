name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: bun test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Unit tests
        run: bun test

      - name: End-to-end smoke (mock muse2api)
        run: bun run test/smoke.mjs

  lint:
    name: 语法与入口自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 入口可被 import 且导出插件工厂
        run: |
          cat > /tmp/load-check.mjs <<'EOF'
          const mod = await import(process.cwd() + "/server/index.mjs")
          const factory = mod.Muse2ApiPlugin
          if (typeof factory !== "function") throw new Error("Muse2ApiPlugin 不是函数")
          const hooks = await factory({ client: { app: { log() {} } } }, {})
          // config 是函数；auth / provider / tool 是对象（宿主按心跳钩子直接使用）
          const shape = { config: "function", auth: "object", provider: "object", tool: "object" }
          for (const [key, kind] of Object.entries(shape)) {
            if (typeof hooks[key] !== kind) throw new Error(`钩子 ${key} 形状不对：期望 ${kind}，实际 ${typeof hooks[key]}`)
          }
          if (hooks.provider.id !== "muse2api") throw new Error("provider.id 不是 muse2api")
          console.log("hooks ok:", Object.keys(hooks).join(","))
          EOF
          bun /tmp/load-check.mjs
