name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: bun test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Unit tests
        run: bun test

      - name: End-to-end smoke (mock muse2api)
        run: bun run test/smoke.mjs

  lint:
    name: 语法与入口自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 入口可被 import 且导出插件工厂
        run: |
          cat > /tmp/load-check.mjs <<'EOF'
          const mod = await import(process.cwd() + "/server/index.mjs")
          const factory = mod.Muse2ApiPlugin
          if (typeof factory !== "function") throw new Error("Muse2ApiPlugin 不是函数")
          const hooks = await factory({ client: { app: { log() {} } } }, {})
          for (const key of ["config", "auth", "provider"]) {
            if (typeof hooks[key] !== "function") throw new Error(`缺少钩子 ${key}`)
          }
          console.log("hooks ok:", Object.keys(hooks).join(","))
          EOF
          bun /tmp/load-check.mjs
